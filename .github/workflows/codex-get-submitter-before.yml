name: ui50 Qwik GET submitter BEFORE
on:
  push:
    branches: [codex/diagnose-get-form-submitter]
permissions:
  contents: read
jobs:
  before:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: upstream
        shell: bash
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: QwikDev/qwik
          ref: d7ec29baab92f77c552322603724f7b960b11e5a
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Install guarded public fixtures and snapshot whole upstream
        run: |
          python3 - <<'PY_ASSETS'
          import base64,hashlib
          from pathlib import Path
          path=Path('e2e/qwik-e2e/apps/qwikrouter-test/src/routes/ui50-get-submit/index.tsx')
          assert not path.exists()
          path.parent.mkdir(parents=True,exist_ok=True)
          data=base64.b64decode('')
          assert hashlib.sha256(data).hexdigest()=='9811aba15481a40b8777c8b6c180a80d01c7fa4036c9c37aefd4614de88e4294'
          path.write_bytes(data)
          path=Path('e2e/qwik-e2e/tests/qwikrouter/ui50-get-submit.e2e.ts')
          assert not path.exists()
          path.parent.mkdir(parents=True,exist_ok=True)
          data=base64.b64decode('')
          assert hashlib.sha256(data).hexdigest()=='f6d5e2eb029b5b58127f9ff33e795f8be7aab3f7d0c2c73944c1a2f052b5b976'
          path.write_bytes(data)
          Path('/tmp/ui50-guard.py').write_text("import hashlib,json,os,subprocess,sys\nfrom pathlib import Path\nexpected = {'e2e/qwik-e2e/apps/qwikrouter-test/src/routes/ui50-get-submit/index.tsx': '9811aba15481a40b8777c8b6c180a80d01c7fa4036c9c37aefd4614de88e4294', 'e2e/qwik-e2e/tests/qwikrouter/ui50-get-submit.e2e.ts': 'f6d5e2eb029b5b58127f9ff33e795f8be7aab3f7d0c2c73944c1a2f052b5b976'}\npin = 'd7ec29baab92f77c552322603724f7b960b11e5a'\nassert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==pin\nsubprocess.run(['git','diff','HEAD','--exit-code'],check=True)\npaths = subprocess.check_output(['git','ls-files','-z']).split(b'\\0')[:-1]\nmanifest=[]\nfor raw in paths:\n path=os.fsdecode(raw); f=Path(path)\n data=os.readlink(f).encode() if f.is_symlink() else f.read_bytes()\n manifest.append([path,hashlib.sha256(data).hexdigest(),f.lstat().st_mode])\nrecord=Path('/tmp/ui50-tracked.json')\nif sys.argv[1]=='before': record.write_text(json.dumps(manifest))\nelse: assert json.loads(record.read_text())==manifest, 'whole tracked source changed'\nfor path,digest in expected.items():\n assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest, 'fixture changed: '+path\nprint('UI50_INTEGRITY',sys.argv[1],len(manifest),hashlib.sha256(json.dumps(manifest).encode()).hexdigest(),json.dumps(expected))\n")
          PY_ASSETS
          python3 /tmp/ui50-guard.py before
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.15.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.22.0
          package_json_file: upstream/package.json
          run_install: false
      - name: Verify official tools and frozen lock
        run: |
          test "$(node --version)" = v24.15.0
          test "$(pnpm --version)" = 11.22.0
          echo 'd1027e009f4d6735cb4ff3f7b5d3f2d864271e39082d1f3e240c66aef669bbb9  pnpm-lock.yaml' | sha256sum -c -
          pnpm install --frozen-lockfile
          test "$(pnpm exec playwright --version)" = 'Version 1.61.1'
      - name: Build actual framework and install official Chromium
        run: |
          pnpm dlx @intellectronica/ruler@0.3.42 apply --no-gitignore --no-mcp
          pnpm build.core.dev
          pnpm exec playwright install --with-deps chromium
      - name: Execute finite native UI fixtures and require exact BEFORE result pattern
        run: |
          set +e
          PLAYWRIGHT_JSON_OUTPUT_FILE=/tmp/ui50-playwright.json pnpm exec playwright test e2e/qwik-e2e/tests/qwikrouter/ui50-get-submit.e2e.ts --browser=chromium --config e2e/qwik-e2e/playwright.config.ts --workers=1 --retries=0 --timeout=180000 --reporter=line,json
          status=$?
          set -e
          export UI50_EXIT_STATUS="$status"
          python3 - <<'PY_RESULT'
          import json,os
          from pathlib import Path
          r=json.loads(Path('/tmp/ui50-playwright.json').read_text())
          found={}
          observed={}
          def visit(s):
           for spec in s.get('specs',[]):
            results=spec['tests'][0]['results']
            assert len(results)==1
            found[spec['title']]=results[0]['status']
            for out in results[0].get('stdout',[]):
             if 'text' in out:
              print(out['text'],end='')
              for line in out['text'].splitlines():
               if line.startswith('UI50_NATIVE_OUTPUT '):
                item=json.loads(line[len('UI50_NATIVE_OUTPUT '):]); observed[item['name']]=item['actual']
           for child in s.get('suites',[]):visit(child)
          visit(r)
          expected={
           'control native named click':'passed',
           'control native named requestSubmit':'passed',
           'bug enhanced named click':'failed',
           'bug enhanced named requestSubmit':'failed',
           'control enhanced unnamed click':'passed',
           'control enhanced hidden scope':'passed',
          }
          print('UI50_NATIVE_RESULTS',json.dumps(found,sort_keys=True))
          assert os.environ['UI50_EXIT_STATUS']=='1'
          assert found==expected, 'unexpected failure pattern; this is not reproduction proof'
          assert set(observed)==set(expected)
          for name,actual in observed.items():
           scope='open' if name.startswith('control native') or name=='control enhanced hidden scope' else ''
           assert actual=={
            'q':'release','scope':scope,'tags':['a','b'],
            'shown':f'q=release;scope={scope}',
            'reports':['Release checklist'] if scope else ['Release checklist','Archived release notes'],
           }, (name,actual)
          assert not r.get('errors'),r.get('errors')
          PY_RESULT
      - name: Verify whole tracked upstream and fixture integrity after all work
        if: always()
        run: python3 /tmp/ui50-guard.py after
